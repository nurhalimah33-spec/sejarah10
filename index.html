
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Sejarah Online</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #eef3f9;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 30px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      color: #183b65;
      font-size: 25px;
    }

    p {
      color: #586579;
      line-height: 1.6;
    }

    .status {
      margin-top: 22px;
      padding: 13px;
      border-radius: 10px;
      background: #e5f7ed;
      color: #176b3a;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>UJIAN SEJARAH ONLINE</h1>
    <p>Selamat datang di aplikasi ujian Sejarah.</p>
    <p>Aplikasi sedang disiapkan untuk digunakan melalui HP dan laptop.</p>
    <div class="status">
      GitHub Pages siap diuji.
    </div>
  </main>
</body>
</html>
